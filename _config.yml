title: qrcp
description: Transfer files over wifi from your computer to your mobile device by scanning a QR code without leaving the terminal.
# url/baseurl are set by GitHub Pages (github.io subpath now, qrcp.sh after the CNAME cutover).
theme: jekyll-theme-primer

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# GoatCounter site code (the "xxx" in xxx.goatcounter.com). Empty = disabled.
goatcounter: "qrcp"
# Only count visits on this host (keeps staging/preview URLs out of the stats).
goatcounter_host: qrcp.sh

github_repo: https://github.com/claudiodangelis/qrcp

nav:
  - title: Home
    url: /
  - title: Docs
    url: /docs/
  - title: Packages
    url: /packages/
  - title: News
    url: /news/
  - title: Tutorials
    url: /tutorials/

permalink: /:categories/:title/

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      category: news
      excerpt_separator: "<!--more-->"

exclude:
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - scripts/
  - README.md
  - vendor/
